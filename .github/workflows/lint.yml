name: Lint and Format Check

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1

      - name: Install flox
        uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2.7.0

      - name: Install dependencies
        run: flox activate -- pnpm install --frozen-lockfile

      - name: Run Prettier format check
        run: flox activate -- pnpm exec prettier --check nodes credentials

      - name: Run ESLint
        run: flox activate -- pnpm run lint

      - name: Run TypeScript type check
        run: flox activate -- pnpm exec tsc --noEmit
